name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  GODOT_VERSION: 4.7.2
  GODOT_CPP_REF: godot-4.5-stable

jobs:
  checks:
    name: Scoring checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot and export templates
        uses: ./.github/actions/setup-godot

      - name: Import project
        run: godot --headless --import

      - name: Run scoring checks
        run: timeout 120 godot --headless -s res://tests/test_scoring.gd

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build Health Connect plugin
        working-directory: android/plugin
        run: ./gradlew --no-daemon copyAarsToAddon

      - name: Install Godot and export templates
        uses: ./.github/actions/setup-godot

      - name: Import project
        run: godot --headless --import

      - name: Export debug APK
        run: |
          keytool -genkeypair -v -keystore "$RUNNER_TEMP/debug.keystore" -storepass android \
            -alias androiddebugkey -keypass android -keyalg RSA -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          export GODOT_ANDROID_KEYSTORE_DEBUG_PATH="$RUNNER_TEMP/debug.keystore"
          export GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey
          export GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android
          mkdir -p build/android
          godot --headless --install-android-build-template --export-debug "Android" build/android/stepio-steptest.apk
          test -f build/android/stepio-steptest.apk

      - name: Check APK contents
        run: |
          AAPT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/aapt"
          "$AAPT" dump permissions build/android/stepio-steptest.apk | tee permissions.txt
          grep -q "android.permission.health.READ_STEPS" permissions.txt
          "$AAPT" dump xmltree build/android/stepio-steptest.apk AndroidManifest.xml | grep -q "org.godotengine.plugin.v2.StepioHealth"

      - uses: actions/upload-artifact@v4
        with:
          name: stepio-steptest-android
          path: build/android/stepio-steptest.apk

  ios:
    name: iOS library and Xcode build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch godot-cpp
        run: git clone --depth 1 -b "$GODOT_CPP_REF" https://github.com/godotengine/godot-cpp ios/godot-cpp

      - name: Build HealthKit GDExtension
        working-directory: ios
        run: |
          pip3 install --break-system-packages scons
          scons platform=ios arch=arm64 target=template_debug -j"$(sysctl -n hw.ncpu)"
          scons platform=ios arch=arm64 target=template_release -j"$(sysctl -n hw.ncpu)"
          ls -la ../addons/stepio_health/bin/ios

      - uses: actions/upload-artifact@v4
        with:
          name: stepio-health-ios-libs
          path: addons/stepio_health/bin/ios/*.dylib

      - name: Install Godot and export templates
        uses: ./.github/actions/setup-godot

      - name: Export Xcode project
        run: |
          godot --headless --import
          # A placeholder team id; the project is only compiled here, never signed.
          sed -i '' 's/application\/app_store_team_id=""/application\/app_store_team_id="ABCDE12345"/' export_presets.cfg
          mkdir -p build/ios
          godot --headless --export-debug "iOS" build/ios/stepio-steptest.ipa
          ls build/ios

      - name: Compile Xcode project without signing
        working-directory: build/ios
        run: |
          xcodebuild -project stepio-steptest.xcodeproj -scheme stepio-steptest \
            -configuration Debug -sdk iphoneos -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO build | tail -40
          exit "${PIPESTATUS[0]}"
