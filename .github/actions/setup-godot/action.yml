name: Set up Godot
description: Installs the Godot editor and export templates, and puts `godot` on PATH.

runs:
  using: composite
  steps:
    - name: Cache Godot
      id: cache
      uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/godot
        key: godot-${{ env.GODOT_VERSION }}-${{ runner.os }}

    - name: Download Godot
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        mkdir -p "$RUNNER_TEMP/godot"
        cd "$RUNNER_TEMP/godot"
        base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
        if [ "$RUNNER_OS" = "macOS" ]; then
          curl -fsSL -o editor.zip "$base/Godot_v${GODOT_VERSION}-stable_macos.universal.zip"
        else
          curl -fsSL -o editor.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
        fi
        unzip -q editor.zip && rm editor.zip
        curl -fsSL -o templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"

    - name: Install Godot
      shell: bash
      run: |
        cd "$RUNNER_TEMP/godot"
        mkdir -p bin
        if [ "$RUNNER_OS" = "macOS" ]; then
          ln -sf "$PWD/Godot.app/Contents/MacOS/Godot" bin/godot
          templates="$HOME/Library/Application Support/Godot/export_templates/${GODOT_VERSION}.stable"
        else
          ln -sf "$PWD/Godot_v${GODOT_VERSION}-stable_linux.x86_64" bin/godot
          templates="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
        fi
        mkdir -p "$templates"
        unzip -q -o templates.tpz -d "$RUNNER_TEMP/templates"
        cp -R "$RUNNER_TEMP/templates/templates/." "$templates/"
        echo "$PWD/bin" >> "$GITHUB_PATH"
